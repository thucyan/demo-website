<!DOCTYPE html>
<html>
<head>
  <title>Yan's Webpage</title>
  <style>
    body {
      background-color: #ffffff;
      margin: 0;
      font-family: sans-serif;
    }
    .banner {
      background-image: url('https://www.agoda.com/wp-content/uploads/2024/06/Duomo-and-Florence-after-sunset.jpg');
      background-size: cover;
      background-position: center;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .banner h1 {
      color: white;
      text-shadow: 2px 2px 4px #000000;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    p {
      text-align: left;
    }
    iframe {
      max-width: 100%;
      display: block;
      margin: 20px auto;
    }
    @media (max-width: 600px) {
      .banner {
        height: 150px;
      }
      .container {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="banner">
    <h1>Hello, GitHub!</h1>
  </div>
  <div class="container">
    <p>This is my first deployed website using GitHub Pages.</p>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/qct0JLjaHDc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    <p><a href="https://www.spacex.com/">Visit SpaceX</a></p>
  </div>
</body>
</html>
