<!DOCTYPE html>
<html>
<head>
  <title>My First GitHub Page</title>
  <style>
    body {
      background-image: url('https://www.agoda.com/wp-content/uploads/2024/06/Duomo-and-Florence-after-sunset.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.5);
      z-index: -1;
    }
    h1, p, iframe {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <h1>Hello, GitHub!</h1>
  <p>This is my first deployed website using GitHub Pages.</p>
  <iframe width="560" height="315" src="https://www.youtube.com/embed/qct0JLjaHDc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  <p><a href="https://www.spacex.com/">Visit SpaceX</a></p>
</body>
</html>
